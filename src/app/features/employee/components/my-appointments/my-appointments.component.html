<div class="appointment-container">

    <div class="toolbar">

        <mat-form-field
            appearance="outline"
            class="search-field">

            <mat-icon matPrefix>

                search

            </mat-icon>

            <input
                matInput
                placeholder="Search customer">

        </mat-form-field>

    </div>

    <div class="filter-container">

        <mat-chip-listbox>

            @for(filter of filters; track filter){

                <mat-chip-option

                    [selected]="selectedFilter===filter">

                    {{filter}}

                </mat-chip-option>

            }

        </mat-chip-listbox>

    </div>

    <div class="table-wrapper">

        <table
            mat-table
            [dataSource]="appointments">

            <!-- Customer -->

            <ng-container matColumnDef="customer">

                <th mat-header-cell *matHeaderCellDef>

                    Customer

                </th>

                <td mat-cell *matCellDef="let row">

                    {{row.customer}}

                </td>

            </ng-container>

            <!-- Service -->

            <ng-container matColumnDef="service">

                <th mat-header-cell *matHeaderCellDef>

                    Service

                </th>

                <td mat-cell *matCellDef="let row">

                    {{row.service}}

                </td>

            </ng-container>

            <!-- Time -->

            <ng-container matColumnDef="time">

                <th mat-header-cell *matHeaderCellDef>

                    Time

                </th>

                <td mat-cell *matCellDef="let row">

                    {{row.time}}

                </td>

            </ng-container>

            <!-- Status -->

            <ng-container matColumnDef="status">

                <th mat-header-cell *matHeaderCellDef>

                    Status

                </th>

                <td mat-cell *matCellDef="let row">

                    <span
                        class="status"

                        [class.pending]="row.status==='Pending'"

                        [class.progress]="row.status==='In Progress'"

                        [class.completed]="row.status==='Completed'"

                        [class.rejected]="row.status==='Rejected'">

                        {{row.status}}

                    </span>

                </td>

            </ng-container>

            <!-- Action -->

            <ng-container matColumnDef="action">

                <th mat-header-cell *matHeaderCellDef>

                    Action

                </th>

                <td mat-cell *matCellDef="let row">

                    @if(row.status==='Pending'){

                        <button
                            mat-flat-button
                            class="start-btn">

                            Start

                        </button>

                    }

                    @else if(row.status==='In Progress'){

                        <button
                            mat-flat-button
                            class="complete-btn">

                            Complete

                        </button>

                    }

                    @else if(row.status==='Completed'){

                        <button
                            mat-stroked-button
                            disabled>

                            Completed

                        </button>

                    }

                    @else{

                        <button
                            mat-stroked-button
                            disabled>

                            Rejected

                        </button>

                    }

                </td>

            </ng-container>

            <tr
                mat-header-row
                *matHeaderRowDef="displayedColumns">
            </tr>

            <tr
                mat-row
                *matRowDef="let row; columns: displayedColumns">
            </tr>

        </table>

    </div>

</div>
