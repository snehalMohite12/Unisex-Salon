<section class="pricing py-5">

    <div class="container">

        <app-section-title
            subtitle="PRICING"
            title="Our Price List"
            description="Transparent pricing for every service.">
        </app-section-title>

        <div class="row g-4">

            <!-- Left Column -->
            <div class="col-lg-6">

                <div class="accordion" id="leftAccordion">

                    @for(category of leftPricing; track category.id){

                    <div class="accordion-item">

                        <h2 class="accordion-header">

                            <button
                                class="accordion-button collapsed"
                                type="button"
                                data-bs-toggle="collapse"
                                [attr.data-bs-target]="'#left'+category.id">

                                {{category.title}}

                            </button>

                        </h2>

                        <div
                            [id]="'left'+category.id"
                            class="accordion-collapse collapse"
                            data-bs-parent="#leftAccordion">

                            <div class="accordion-body">

                                @for(service of category.services; track service.name){

                                <div class="price-row">

                                    <span>{{service.name}}</span>

                                    <strong>₹ {{service.price}}</strong>

                                </div>

                                }

                            </div>

                        </div>

                    </div>

                    }

                </div>

            </div>

            <!-- Right Column -->

            <div class="col-lg-6">

                <div class="accordion" id="rightAccordion">

                    @for(category of rightPricing; track category.id){

                    <div class="accordion-item">

                        <h2 class="accordion-header">

                            <button
                                class="accordion-button collapsed"
                                type="button"
                                data-bs-toggle="collapse"
                                [attr.data-bs-target]="'#right'+category.id">

                                {{category.title}}

                            </button>

                        </h2>

                        <div
                            [id]="'right'+category.id"
                            class="accordion-collapse collapse"
                            data-bs-parent="#rightAccordion">

                            <div class="accordion-body">

                                @for(service of category.services; track service.name){

                                <div class="price-row">

                                    <span>{{service.name}}</span>

                                    <strong>₹ {{service.price}}</strong>

                                </div>

                                }

                            </div>

                        </div>

                    </div>

                    }

                </div>

            </div>

        </div>

    </div>

</section>
